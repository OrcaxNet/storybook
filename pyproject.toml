[project]
name = "storybook"
version = "0.1.0"
description = "Storybook - 离线Coding记忆系统，模拟夜间记忆梳理的程序员记忆库"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "numpy>=1.24",
    "sqlite-vec>=0.1",
]

[project.optional-dependencies]
# 测试套件依赖：pytest + 覆盖率。`uv pip install -e ".[test]"` 安装。
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# MCP server 依赖：把记忆检索暴露给 MCP-aware agent（如 Claude Code）。
# `uv pip install -e ".[mcp]"` 安装；之后 `storybook mcp` 启动 server。
mcp = [
    "mcp>=1.2,<2",
]

[project.scripts]
storybook = "storybook.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 失败用例摘要、禁用警告噪音、显式标注被 skip 的原因
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:storybook.*",
]
