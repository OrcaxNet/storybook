[project]
name = "storybook"
version = "0.1.0"
description = "Storybook - 离线Coding记忆系统，模拟夜间记忆梳理的程序员记忆库"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "numpy>=1.24",
    "sqlite-vec>=0.1",
]

[project.scripts]
storybook = "storybook.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
