[project]
name = "storybook"
version = "0.1.2"
description = "Storybook - 离线Coding记忆系统，模拟夜间记忆梳理的程序员记忆库"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "numpy>=1.24",
    "sqlite-vec>=0.1",
    # setup 会自动接入 MCP-aware agents，因此 server runtime 属于基础安装。
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
# 测试套件依赖：pytest + 覆盖率。`uv pip install -e ".[test]"` 安装。
test = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# 兼容旧安装命令 ``.[mcp]``；MCP runtime 自 v0.2 起已包含在基础依赖中。
mcp = [
    "mcp>=1.2,<2",
]

[project.scripts]
storybook = "storybook.cli:cli"
book = "storybook.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 失败用例摘要、禁用警告噪音、显式标注被 skip 的原因
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:storybook.*",
]
