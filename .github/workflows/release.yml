name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and test dependencies
        run: python -m pip install --disable-pip-version-check build -e '.[test]'
      - name: Verify tag matches package version
        run: >-
          test "$GITHUB_REF_NAME" =
          "v$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
      - name: Run release gate
        run: python -m pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check build
      - name: Verify tag matches package version
        run: >-
          test "$GITHUB_REF_NAME" =
          "v$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
      - name: Build and verify fixed-name installer assets
        run: ./scripts/build_release_assets.sh release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/storybook.tar.gz
          release-assets/storybook.tar.gz.sha256
          --verify-tag --generate-notes
