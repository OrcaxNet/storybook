name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.11"
      - name: Install SQLite-capable Python on macOS
        if: runner.os == 'macOS'
        run: brew install python@3.11
      - name: Create isolated test environment
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            base_python="$(brew --prefix python@3.11)/bin/python3.11"
          else
            base_python=python
          fi
          "$base_python" -m venv "$RUNNER_TEMP/storybook-ci"
          echo "STORYBOOK_CI_PYTHON=$RUNNER_TEMP/storybook-ci/bin/python" >> "$GITHUB_ENV"
      - name: Verify Python and SQLite extension support
        run: >-
          $STORYBOOK_CI_PYTHON -c 'import sqlite3, sys;
          assert sys.version_info[:2] == (3, 11);
          connection = sqlite3.connect(":memory:");
          connection.enable_load_extension(True);
          connection.enable_load_extension(False)'
      - name: Install build and test dependencies
        run: $STORYBOOK_CI_PYTHON -m pip install --disable-pip-version-check build -e '.[test]'
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          test "$GITHUB_REF_NAME" =
          "v$("$STORYBOOK_CI_PYTHON" -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
      - name: Run release gate
        run: $STORYBOOK_CI_PYTHON -m pytest

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check build
      - name: Verify tag matches package version
        run: >-
          test "$GITHUB_REF_NAME" =
          "v$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
      - name: Build and verify fixed-name installer assets
        run: ./scripts/build_release_assets.sh release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/storybook.tar.gz
          release-assets/storybook.tar.gz.sha256
          --verify-tag --generate-notes
