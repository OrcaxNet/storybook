[project]
name = "context-hub-pilot"
version = "0.1.0"
description = "Local-only evidence-first context hub pilot (FF-122)"
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk==0.2.179", "mcp>=1.2,<2"]

[project.scripts]
context-hub = "context_hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
